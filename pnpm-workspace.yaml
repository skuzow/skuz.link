allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
# pnpm rechecks the lockfile on every install, so these stay until they clear
# the 24-hour wait. Remove after 2026-11-02 23:19 UTC.
minimumReleaseAgeExclude:
