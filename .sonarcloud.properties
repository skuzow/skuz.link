sonar.sources=.
sonar.tests=.

# Generated code: drizzle-kit migrations, better-auth tables, shadcn-vue components
# Test files are excluded from sources and analysed as tests instead
sonar.exclusions=server/database/migrations/**,layers/auth/server/infrastructure/schema.ts,layers/base/app/components/ui/**,**/*.test.ts,app/testing/**,layers/*/app/testing/**,server/testing/**
sonar.test.inclusions=**/*.test.ts,app/testing/**,layers/*/app/testing/**,server/testing/**

# Tailwind's @utility opens a rule, so its nested & has a scoping root. Sonar's CSS parser doesn't know that
# The blank plate takes no keyboard focus on purpose: the Create link Button beside it is the keyboard's path
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e1.resourceKey=layers/base/app/assets/css/tailwind.css
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=layers/links/app/components/links/Empty.vue
