sonar.sources=.
sonar.tests=.

# Generated code: drizzle-kit migrations, better-auth tables, shadcn-vue components
# Test files are excluded from sources and analysed as tests instead
sonar.exclusions=server/database/migrations/**,layers/auth/server/infrastructure/schema.ts,layers/base/app/components/ui/**,**/*.test.ts,app/testing/**,layers/*/app/testing/**,server/testing/**
sonar.test.inclusions=**/*.test.ts,app/testing/**,layers/*/app/testing/**,server/testing/**
