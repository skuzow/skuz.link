sonar.sources=.
sonar.tests=.

# Generated code: drizzle-kit migrations, shadcn-vue components
# Test files are excluded from sources and analysed as tests instead
sonar.exclusions=server/database/migrations/**,app/components/ui/**,**/*.test.ts,app/testing/**,server/testing/**
sonar.test.inclusions=**/*.test.ts,app/testing/**,server/testing/**
